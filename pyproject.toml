[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-supervisor"
version = "0.1.0"
description = "Personal multi-agent coding supervisor with Telegram, Kimi and DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "AI Supervisor" }]
dependencies = [
  "aiogram>=3.30,<4",
  "aiosqlite>=0.21,<1",
  "deepseek-harness-sdk==0.2.2rc2",
  "openai>=2,<4",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12",
]

[project.scripts]
ai-supervisor = "ai_supervisor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_supervisor = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:ai_supervisor.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
